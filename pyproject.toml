[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snowcortex"
version = "0.1.0"
description = "Snowflake Cortex examples: LLM functions, Search (RAG), Analyst, Agents and an MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "snowflake-connector-python>=3.12",
  "snowflake>=1.0.0",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
snowcortex = "snowcortex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
